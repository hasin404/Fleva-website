<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — FLEVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .auth-wrap{ display:flex; min-height:calc(100vh - 84px); }
  .auth-panel{ flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px; }
  .auth-card{ width:100%; max-width:400px; }
  .auth-card .eyebrow{ font-family:var(--font-mark); color:var(--pink); font-size:1.3rem; display:block; margin-bottom:6px; }
  .auth-card h1{ font-size:2.2rem; margin-bottom:28px; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px; }
  .field input{ width:100%; padding:14px 16px; border:2px solid var(--line); border-radius:var(--radius-sm); background:var(--cream-soft); transition:border-color .2s; }
  .field input:focus{ border-color:var(--ink); outline:none; }
  .field-error{ color:var(--pink-deep); font-size:0.76rem; margin-top:6px; display:none; }
  .field.invalid input{ border-color:var(--pink-deep); }
  .field.invalid .field-error{ display:block; }
  .auth-row{ display:flex; justify-content:space-between; align-items:center; font-size:0.82rem; margin-bottom:24px; }
  .auth-row a{ font-weight:600; text-decoration:underline; }
  .auth-switch{ text-align:center; margin-top:24px; font-size:0.88rem; }
  .auth-switch a{ font-weight:700; color:var(--pink-deep); }
  .auth-visual{
    flex:1; background:var(--ink); color:var(--cream); display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; overflow:hidden; padding:40px;
  }
  .auth-visual h2{ font-family:var(--font-mark); text-transform:none; font-size:2.4rem; text-align:center; line-height:1.2; position:relative; z-index:2; }
  .auth-visual h2 b{ color:var(--lime); }
  .auth-visual .blob{ position:absolute; width:60%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,#3a2418,transparent 70%); top:-10%; right:-10%; }

  /* Interactive Eye Tracking Component */
  .eyes-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin-top: 36px;
    position: relative;
    z-index: 5;
  }
  .eye {
    width: 76px;
    height: 76px;
    background: #FFFFFF;
    border-radius: 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45), inset 0 3px 6px rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }
  .pupil {
    width: 34px;
    height: 34px;
    background: #16140F;
    border-radius: 50%;
    position: absolute;
    transition: transform 0.04s ease-out;
    pointer-events: none;
  }
  .pupil::after {
    content: '';
    position: absolute;
    top: 6px;
    right: 6px;
    width: 9px;
    height: 9px;
    background: #FFFFFF;
    border-radius: 50%;
  }
  @media (max-width:860px){ .auth-visual{ display:none; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">FLEVA</a>
    <nav class="nav-main"><a href="shop.html">Shop</a><a href="about.html">Our Story</a></nav>
    <div class="header-icons">
      <a href="checkout.html" class="icon-btn" aria-label="Cart">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-count" data-cart-count>0</span>
      </a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-panel">
    <div class="auth-card">
      <span class="eyebrow">Welcome back</span>
      <h1>Log in</h1>
      <form id="login-form" novalidate>
        <div class="field" id="f-email">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
          <span class="field-error">Enter a valid email address.</span>
        </div>
        <div class="field" id="f-password">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" placeholder="••••••••">
          <span class="field-error">Password must be at least 6 characters.</span>
        </div>
        <div class="auth-row">
          <label style="display:flex;align-items:center;gap:8px;font-weight:500;"><input type="checkbox" style="width:auto;"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in <span class="btn-dot">→</span></button>
      </form>
      <p class="auth-switch">New to Fleva? <a href="signup.html">Create an account</a></p>
    </div>
  </div>
  <div class="auth-visual">
    <div class="blob"></div>
    <h2>Real fruits.<br>Crazy good.<br><b>Fleva.</b></h2>
    <!-- Interactive Cursor Tracking Eyes -->
    <div class="eyes-container" id="eyes-container">
      <div class="eye"><div class="pupil"></div></div>
      <div class="eye"><div class="pupil"></div></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
  const form = document.getElementById('login-form');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const submitBtn = form.querySelector('button[type="submit"]');
    let valid = true;

    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);
    document.getElementById('f-email').classList.toggle('invalid', !emailOk);
    if(!emailOk) valid = false;

    const passOk = password.value.length >= 6;
    document.getElementById('f-password').classList.toggle('invalid', !passOk);
    if(!passOk) valid = false;

    if(!valid) return;

    submitBtn.disabled = true;
    submitBtn.innerHTML = 'Logging in…';

    try {
      const user = await logIn(email.value, password.value);
      showToast(`Welcome back, ${user.name || email.value.split('@')[0]}!`);
      setTimeout(() => location.href = 'account.html', 700);
    } catch (err) {
      showToast(err.message || 'Login failed. Please try again.');
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Log in <span class="btn-dot">→</span>';
    }
  });
  // Interactive Eye Tracking Logic
  const eyes = document.querySelectorAll('.eye');
  const pupils = document.querySelectorAll('.pupil');

  if (eyes.length && pupils.length) {
    document.addEventListener('mousemove', (e) => {
      eyes.forEach((eye, index) => {
        const rect = eye.getBoundingClientRect();
        const eyeCenterX = rect.left + rect.width / 2;
        const eyeCenterY = rect.top + rect.height / 2;

        const dx = e.clientX - eyeCenterX;
        const dy = e.clientY - eyeCenterY;
        const angle = Math.atan2(dy, dx);

        const maxDistance = 18; // Max travel radius for pupils
        const distance = Math.min(maxDistance, Math.hypot(dx, dy) / 10);

        const pupilX = Math.cos(angle) * distance;
        const pupilY = Math.sin(angle) * distance;

        if (pupils[index]) {
          pupils[index].style.transform = `translate(${pupilX}px, ${pupilY}px)`;
        }
      });
    });
  }
</script>
</body>
</html>
