<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — FLEVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="product-grid.css">
<style>
  .filter-bar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .filter-chip{
    padding:9px 18px; border-radius:var(--radius-pill); border:1.5px solid var(--ink); font-size:0.8rem; font-weight:600;
    background:transparent; transition:background .2s,color .2s;
  }
  .filter-chip.active, .filter-chip:hover{ background:var(--ink); color:var(--cream); }
  .shop-toolbar{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin:24px 0 8px; }
  .result-count{ font-size:0.82rem; color:var(--ink-soft); font-family:var(--font-mono); }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">FLEVA</a>
    <nav class="nav-main">
      <a href="shop.html" class="active">Shop</a>
      <a href="shop.html">Explore</a>
      <a href="about.html">Our Story</a>
      <a href="shop.html">Fleva World</a>
      <a href="account.html">Rewards</a>
    </nav>
    <div class="header-icons">
      <a href="login.html" class="icon-btn" data-auth-icon aria-label="Account">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      </a>
      <a href="checkout.html" class="icon-btn" aria-label="Cart">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-count" data-cart-count>0</span>
      </a>
      <button class="icon-btn menu-toggle" aria-label="Open menu" onclick="document.querySelector('.mobile-nav').classList.add('open')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="mobile-nav">
  <div class="mobile-nav-top"><span class="logo">FLEVA</span><button class="close-btn" aria-label="Close menu">✕</button></div>
  <a href="shop.html">Shop</a>
  <a href="shop.html">Explore</a>
  <a href="about.html">Our Story</a>
  <a href="account.html">Rewards</a>
</div>

<section class="page-hero">
  <div class="wrap">
    <span class="eyebrow">The full lineup</span>
    <h1>Shop Fleva</h1>
  </div>
</section>

<section class="section" style="padding-top:0;">
  <div class="wrap">
    <div class="filter-bar" id="filter-bar">
      <button class="filter-chip active" data-filter="All">All</button>
    </div>
    <div class="shop-toolbar">
      <span class="result-count" id="result-count"></span>
    </div>
    <div class="product-grid" id="shop-grid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-top">
      <div class="footer-tag">Crunch different.<br>Live <b>Fleva</b>.</div>
      <form class="newsletter-form" onsubmit="event.preventDefault(); showToast('Thanks — you\\'re on the list!'); this.reset();">
        <input type="email" placeholder="Enter your email" required>
        <button type="submit" aria-label="Subscribe">→</button>
      </form>
    </div>
    <div class="footer-bottom">
      <span class="footer-copy">© 2026 FLEVA. All rights reserved.</span>
      <div class="footer-social"><a href="#">IG</a><a href="#">TT</a><a href="#">YT</a></div>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script>
  const categories = ["All", ...new Set(PRODUCTS.map(p=>p.category))];
  const filterBar = document.getElementById('filter-bar');
  filterBar.innerHTML = categories.map((c,i)=>`<button class="filter-chip ${i===0?'active':''}" data-filter="${c}">${c}</button>`).join('');

  function render(filter){
    const list = filter === "All" ? PRODUCTS : PRODUCTS.filter(p=>p.category===filter);
    document.getElementById('shop-grid').innerHTML = list.map(renderProductCard).join('');
    document.getElementById('result-count').textContent = `${list.length} product${list.length!==1?'s':''}`;
  }
  render("All");

  filterBar.addEventListener('click', e=>{
    const btn = e.target.closest('.filter-chip');
    if(!btn) return;
    filterBar.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
</script>
</body>
</html>
