<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  .filter-bar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .filter-chip{
    padding:9px 18px; border-radius:var(--radius-pill); border:1.5px solid var(--ink); font-size:0.8rem; font-weight:600;

  .filter-chip.active, .filter-chip:hover{ background:var(--ink); color:var(--cream); }
  .shop-toolbar{ display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin:24px 0 8px; }
  .result-count{ font-size:0.82rem; color:var(--ink-soft); font-family:var(--font-mono); }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">FLEVA</a>
    <nav class="nav-main">

      <a href="about.html">Our Story</a>

    </nav>
    <div class="header-icons">
      <a href="login.html" class="icon-btn" data-auth-icon aria-label="Account">

      <a href="checkout.html" class="icon-btn" aria-label="Cart">

      <button class="icon-btn menu-toggle" aria-label="Open menu" onclick="document.querySelector('.mobile-nav').classList.add('open')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="mobile-nav">
  <div class="mobile-nav-top"><span class="logo">FLEVA</span><button class="close-btn" aria-label="Close menu">✕</button></div>
  <a href="shop.html" class="active">Shop</a>
  <a href="about.html">Our Story</a>
  <a href="account.html">Rewards</a>
</div>

<section class="page-hero">
  <div class="wrap">
    <span class="eyebrow">The full lineup</span>
    <h1>Shop Fleva</h1>
  </div>
</section>

<section class="section" style="padding-top:0;">
  <div class="wrap">
    <div class="filter-bar" id="filter-bar">
      <button class="filter-chip active" data-filter="All">All</button>
    </div>
    <div class="shop-toolbar">
      <span class="result-count" id="result-count"></span>
    </div>
    <div class="product-grid" id="shop-grid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-top">
      <div class="footer-tag">Crunch different.<br>Live <b>Fleva</b>.</div>
      <form class="newsletter-form" onsubmit="event.preventDefault(); showToast('Thanks — you\\'re on the list!'); this.reset();">
        <input type="email" placeholder="Enter your email" required>
        <button type="submit" aria-label="Subscribe">→</button>
      </form>
    </div>
    <div class="footer-bottom">
      <span class="footer-copy">© 2026 FLEVA. All rights reserved.</span>
      <div class="footer-social">
  <a href="https://instagram.com/flevaworld" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
  </a>
  <a href="https://facebook.com/flevaworld" aria-label="Facebook" target="_blank" rel="noopener noreferrer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3.81l.39-4h-4.2V7a1 1 0 0 1 1-1h3z"></path></svg>
  </a>
</div>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script>
  function initShop() {
    const categories = ["All", ...new Set(PRODUCTS.map(p=>p.category))];
    const filterBar = document.getElementById('filter-bar');
    filterBar.innerHTML = categories.map((c,i)=>`<button class="filter-chip ${i===0?'active':''}" data-filter="${c}">${c}</button>`).join('');

    const params = new URLSearchParams(window.location.search);
    const query = params.get('q') ? params.get('q').toLowerCase() : '';

    function render(filter){
      let list = filter === "All" ? PRODUCTS : PRODUCTS.filter(p=>p.category===filter);
      
      if (query) {
        list = list.filter(p => p.name.toLowerCase().includes(query) || (p.desc && p.desc.toLowerCase().includes(query)) || (p.tag && p.tag.toLowerCase().includes(query)));
        document.querySelector('.page-hero h1').innerHTML = `Search: <span>"${params.get('q')}"</span>`;
        document.querySelector('.page-hero .eyebrow').textContent = "Results";
      }

      document.getElementById('shop-grid').innerHTML = list.map(renderProductCard).join('');
      document.getElementById('result-count').textContent = `${list.length} product${list.length!==1?'s':''}`;
    }

    const currentFilter = filterBar.querySelector('.filter-chip.active')?.dataset.filter || 'All';
    render(currentFilter);

    filterBar.addEventListener('click', e=>{
      const btn = e.target.closest('.filter-chip');
      if(!btn) return;
      filterBar.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      render(btn.dataset.filter);
    });
  }

  // Init immediately with static data, re-init when API data arrives
  initShop();
  window.addEventListener('products-loaded', initShop);
</script>
<script src="chat-widget.js"></script>
</body>
</html>
