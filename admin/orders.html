<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — FLEVA Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<style>
  .status-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .status-chip {
    padding: 6px 14px; border-radius: var(--radius-pill); border: 1.5px solid var(--ink);
    font-size: 0.72rem; font-weight: 600; background: transparent; cursor: pointer; transition: all .2s;
  }
  .status-chip.active, .status-chip:hover { background: var(--ink); color: var(--cream); }
  .order-detail-overlay {
    position: fixed; inset: 0; background: rgba(22,20,15,0.6); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .order-detail-overlay.open { display: flex; }
  .order-detail-card {
    background: var(--cream); border-radius: var(--radius-lg); padding: 32px;
    width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto;
  }
  .order-detail-card h2 { font-size: 1.2rem; margin-bottom: 16px; }
  .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.88rem; }
  .detail-row b { color: var(--ink-soft); }
  .order-items { margin: 16px 0; }
  .order-item { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.85rem; }
  .tracking-timeline { margin: 16px 0; padding-left: 16px; border-left: 2px solid var(--lime); }
  .tracking-step { padding: 4px 0 12px 12px; font-size: 0.82rem; position: relative; }
  .tracking-step::before { content: ''; position: absolute; left: -21px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--lime); }
  .tracking-step .time { font-size: 0.7rem; color: var(--ink-soft); font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="admin-layout">
  <div id="sidebar"></div>
  <main class="admin-main">
    <div class="admin-header">
      <div class="header-left"><button class="admin-mobile-toggle" onclick="document.querySelector('.admin-sidebar').classList.toggle('open')">☰</button><h1>Orders</h1></div>
      <div class="header-right">
        <div class="date" id="current-date"></div>
        <div id="header-user"></div>
      </div>
    </div>

    <div class="status-filter" id="status-filter">
      <button class="status-chip active" data-status="">All</button>
      <button class="status-chip" data-status="pending">Pending</button>
      <button class="status-chip" data-status="confirmed">Confirmed</button>
      <button class="status-chip" data-status="packed">Packed</button>
      <button class="status-chip" data-status="shipped">Shipped</button>
      <button class="status-chip" data-status="delivered">Delivered</button>
      <button class="status-chip" data-status="cancelled">Cancelled</button>
    </div>

    <div class="data-section">
      <div class="table-responsive"><table class="data-table">
        <thead><tr><th>Order #</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
        <tbody id="order-list"></tbody>
      </table></div>
      <div id="pagination" style="display:flex;gap:8px;justify-content:center;padding-top:16px;"></div>
    </div>
  </main>
</div>

<!-- Order Detail Modal -->
<div class="order-detail-overlay" id="order-detail-overlay">
  <div class="order-detail-card" id="order-detail-card"></div>
</div>

<script src="admin.js"></script>
<script>
  if (!requireAdmin()) throw new Error('Not admin');
  document.getElementById('sidebar').innerHTML = renderSidebar();
  document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  let currentStatus = '';
  let currentPage = 1;

  document.getElementById('status-filter').addEventListener('click', (e) => {
    const chip = e.target.closest('.status-chip');
    if (!chip) return;
    document.querySelectorAll('.status-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentStatus = chip.dataset.status;
    loadOrders(1);
  });

  async function loadOrders(page = 1) {
    currentPage = page;
    try {
      let url = `${API_BASE}/orders/admin/all?page=${page}&limit=15`;
      if (currentStatus) url += `&status=${currentStatus}`;

      const res = await adminFetch(url);
      const data = await res.json();

      document.getElementById('order-list').innerHTML = data.orders.length
        ? data.orders.map(o => `<tr>
            <td><strong>${o.orderNumber || '—'}</strong></td>
            <td>${o.user?.name || o.guestName || '—'}</td>
            <td>${o.items?.length || 0}</td>
            <td>৳${o.total}</td>
            <td style="text-transform:uppercase;font-size:0.75rem;">${o.paymentMethod}</td>
            <td>${statusBadge(o.orderStatus)}</td>
            <td>${formatDate(o.createdAt)}</td>
            <td>
              <button class="btn-sm" onclick="viewOrder('${o._id}')">View</button>
            </td>
          </tr>`).join('')
        : '<tr><td colspan="8" style="text-align:center;color:var(--ink-soft)">No orders found</td></tr>';

      let paginationHtml = '';
      for (let i = 1; i <= data.pages; i++) {
        paginationHtml += `<button class="btn-sm" onclick="loadOrders(${i})" ${i === data.page ? 'style="background:var(--ink);color:var(--cream)"' : ''}>${i}</button>`;
      }
      document.getElementById('pagination').innerHTML = paginationHtml;
    } catch (err) {
      document.getElementById('order-list').innerHTML = '<tr><td colspan="8" style="color:var(--red)">Failed to load orders</td></tr>';
    }
  }

  async function viewOrder(id) {
    const res = await adminFetch(`${API_BASE}/orders/${id}`);
    const { order: o } = await res.json();

    const statuses = ['pending', 'confirmed', 'packed', 'shipped', 'out-for-delivery', 'delivered'];

    document.getElementById('order-detail-card').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2>Order #${o.orderNumber}</h2>
        <button class="btn-sm" onclick="document.getElementById('order-detail-overlay').classList.remove('open')">Close</button>
      </div>
      <div class="detail-row"><b>Customer</b><span>${o.user?.name || o.guestName || '—'}</span></div>
      <div class="detail-row"><b>Email</b><span>${o.shippingAddress?.email || o.user?.email || '—'}</span></div>
      <div class="detail-row"><b>Phone</b><span>${o.shippingAddress?.phone || '—'}</span></div>
      <div class="detail-row"><b>Address</b><span>${o.shippingAddress?.street || ''}, ${o.shippingAddress?.city || ''} ${o.shippingAddress?.zip || ''}</span></div>
      <div class="detail-row"><b>Payment</b><span style="text-transform:uppercase">${o.paymentMethod}</span></div>
      <div class="detail-row"><b>Status</b>${statusBadge(o.orderStatus)}</div>

      <div class="order-items">
        <h3 style="font-size:0.9rem;margin-bottom:8px;">Items</h3>
        ${o.items.map(i => `<div class="order-item"><span>${i.title || 'Product'} × ${i.qty}</span><span>৳${i.price * i.qty}</span></div>`).join('')}
        <div class="order-item" style="border-top:1px solid var(--line);padding-top:8px;"><b>Subtotal</b><span>৳${o.subtotal}</span></div>
        <div class="order-item"><b>Delivery</b><span>৳${o.deliveryFee}</span></div>
        <div class="order-item" style="font-weight:800;font-size:1rem;"><b>Total</b><span>৳${o.total}</span></div>
      </div>

      <h3 style="font-size:0.9rem;margin-bottom:8px;">Tracking</h3>
      <div class="tracking-timeline">
        ${(o.trackingHistory || []).map(t => `<div class="tracking-step"><span class="time">${formatDate(t.timestamp)}</span><br>${t.message || t.status}</div>`).join('')}
      </div>

      ${!['delivered', 'cancelled', 'refunded'].includes(o.orderStatus) ? `
      <div style="margin-top:16px;">
        <label style="font-size:0.75rem;font-weight:700;">Update Status</label>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
          ${statuses.filter(s => s !== o.orderStatus).map(s => `<button class="btn-sm success" onclick="updateStatus('${o._id}', '${s}')">${s}</button>`).join('')}
          <button class="btn-sm danger" onclick="updateStatus('${o._id}', 'cancelled')">Cancel</button>
        </div>
      </div>` : ''}
    `;
    document.getElementById('order-detail-overlay').classList.add('open');
  }

  async function updateStatus(id, status) {
    await adminFetch(`${API_BASE}/orders/${id}/status`, {
      method: 'PUT',
      body: JSON.stringify({ status, message: `Order ${status}` }),
    });
    document.getElementById('order-detail-overlay').classList.remove('open');
    loadOrders(currentPage);
  }

  document.getElementById('order-detail-overlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
  });

  loadOrders();
</script>
</body>
</html>
