<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — FLEVA Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-layout" id="admin-root">
  <div id="sidebar"></div>
  <main class="admin-main">
    <div class="admin-header">
      <div class="header-left"><button class="admin-mobile-toggle" onclick="document.querySelector('.admin-sidebar').classList.toggle('open')">☰</button><h1>Dashboard</h1></div>
      <div class="header-right">
        <div class="date" id="current-date"></div>
        <div id="header-user"></div>
      </div>
    </div>

    <div class="stat-grid" id="stat-grid"></div>

    <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:24px;">
      <div class="data-section">
        <h2>Recent Orders</h2>
        <div class="table-responsive"><table class="data-table">
          <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
          <tbody id="recent-orders"></tbody>
        </table></div>
      </div>
      <div class="data-section">
        <h2>Low Stock Products</h2>
        <div class="table-responsive"><table class="data-table">
          <thead><tr><th>Product</th><th>Stock</th></tr></thead>
          <tbody id="low-stock"></tbody>
        </table></div>
      </div>
    </div>
  </main>
</div>

<script src="admin.js"></script>
<script>
  if (!requireAdmin()) throw new Error('Not admin');

  document.getElementById('sidebar').innerHTML = renderSidebar();
  document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  async function loadDashboard() {
    try {
      const res = await adminFetch(`${API_BASE}/analytics/dashboard`);
      const { dashboard: d } = await res.json();

      document.getElementById('stat-grid').innerHTML = `
        <div class="stat-card"><span class="label">Total Revenue</span><span class="value">৳${d.totalRevenue.toLocaleString()}</span></div>
        <div class="stat-card"><span class="label">Today's Revenue</span><span class="value">৳${d.todaysRevenue.toLocaleString()}</span></div>
        <div class="stat-card"><span class="label">Total Orders</span><span class="value">${d.totalOrders}</span></div>
        <div class="stat-card"><span class="label">Customers</span><span class="value">${d.totalCustomers}</span></div>
        <div class="stat-card"><span class="label">Products</span><span class="value">${d.totalProducts}</span></div>
        <div class="stat-card"><span class="label">Today's Orders</span><span class="value">${d.todaysOrders}</span></div>
        <div class="stat-card"><span class="label">Monthly Revenue</span><span class="value">৳${d.monthlyRevenue.toLocaleString()}</span></div>
        <div class="stat-card"><span class="label">Monthly Orders</span><span class="value">${d.monthlyOrders}</span></div>
      `;

      document.getElementById('recent-orders').innerHTML = d.recentOrders.length
        ? d.recentOrders.map(o => `<tr>
            <td>${o.orderNumber || '—'}</td>
            <td>${o.user?.name || o.guestName || '—'}</td>
            <td>৳${o.total}</td>
            <td>${statusBadge(o.orderStatus)}</td>
            <td>${formatDate(o.createdAt)}</td>
          </tr>`).join('')
        : '<tr><td colspan="5" style="text-align:center;color:var(--ink-soft)">No orders yet</td></tr>';

      document.getElementById('low-stock').innerHTML = d.lowStock.length
        ? d.lowStock.map(p => `<tr>
            <td>${p.title}</td>
            <td><span class="badge ${p.stock === 0 ? 'badge-out-of-stock' : 'badge-low'}">${p.stock}</span></td>
          </tr>`).join('')
        : '<tr><td colspan="2" style="text-align:center;color:var(--ink-soft)">All stock healthy</td></tr>';

    } catch (err) {
      console.error('Dashboard load error:', err);
      document.getElementById('stat-grid').innerHTML = '<p style="color:var(--red)">Failed to load dashboard data. Make sure the backend is running.</p>';
    }
  }

  loadDashboard();
</script>
</body>
</html>
