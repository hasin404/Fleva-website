<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — FLEVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .checkout-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:48px; align-items:start; }
  @media (max-width:940px){ .checkout-grid{ grid-template-columns:1fr; } }

  .cart-line{ display:flex; gap:16px; align-items:center; padding:16px 0; border-bottom:1px solid var(--line); }
  .cart-line .media{ width:64px; height:64px; background:var(--cream-soft); border-radius:var(--radius-sm); flex-shrink:0; padding:6px; }
  .cart-line .media svg{ width:100%; height:100%; }
  .cart-line .info{ flex:1; min-width:0; }
  .cart-line .info h4{ font-family:var(--font-body); text-transform:none; font-size:0.92rem; font-weight:700; }
  .cart-line .info span{ font-size:0.76rem; color:var(--ink-soft); }
  .cart-line .qty-stepper{ display:flex; align-items:center; border:1.5px solid var(--ink); border-radius:var(--radius-pill); }
  .cart-line .qty-stepper button{ width:30px; height:30px; background:none; border:0; }
  .cart-line .qty-stepper span{ width:24px; text-align:center; font-family:var(--font-mono); font-size:0.82rem; color:var(--ink); }
  .cart-line .price{ font-family:var(--font-mono); font-weight:700; width:74px; text-align:right; }
  .cart-line .remove{ background:none; border:0; color:var(--ink-soft); font-size:0.9rem; padding:4px; }
  .cart-line .remove:hover{ color:var(--pink-deep); }

  .empty-cart{ text-align:center; padding:60px 20px; color:var(--ink-soft); }

  fieldset{ border:0; padding:0; margin:0 0 28px; }
  legend{ font-size:0.85rem; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:14px; }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:520px){ .field-grid{ grid-template-columns:1fr; } }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:7px; }
  .field input{ width:100%; padding:13px 15px; border:2px solid var(--line); border-radius:var(--radius-sm); background:var(--cream-soft); }
  .field input:focus{ border-color:var(--ink); outline:none; }

  .pay-options{ display:flex; flex-direction:column; gap:10px; }
  .pay-option{ display:flex; align-items:center; gap:12px; border:2px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px; cursor:pointer; transition:border-color .2s, background .2s; }
  .pay-option:has(input:checked){ border-color:var(--ink); background:var(--cream-soft); }
  .pay-option input{ width:auto; }
  .pay-option .swatch{ width:36px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:0.6rem; font-weight:800; color:#fff; }
  .pay-option .label{ font-weight:600; font-size:0.9rem; flex:1; }
  .pay-option .sub{ font-size:0.72rem; color:var(--ink-soft); }

  .summary-card{ background:var(--cream-soft); border-radius:var(--radius-lg); padding:28px; position:sticky; top:104px; }
  .summary-row{ display:flex; justify-content:space-between; margin-bottom:12px; font-size:0.9rem; }
  .summary-row.total{ font-size:1.15rem; font-weight:800; padding-top:14px; border-top:1px solid var(--line); margin-top:6px; }
  .summary-row.total span:last-child{ font-family:var(--font-mono); }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">FLEVA</a>
    <nav class="nav-main"><a href="shop.html">Shop</a><a href="about.html">Our Story</a></nav>
    <div class="header-icons">
      <a href="login.html" class="icon-btn" data-auth-icon aria-label="Account">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      </a>
    </div>
  </div>
</header>

<section class="page-hero" style="padding-bottom:0;">
  <div class="wrap"><span class="eyebrow">Almost there</span><h1>Checkout</h1></div>
</section>

<section class="section">
  <div class="wrap checkout-grid">
    <div>
      <div id="cart-lines"></div>

      <form id="checkout-form">
        <fieldset>
          <legend>Shipping details</legend>
          <div class="field"><label for="c-name">Full name</label><input id="c-name" required></div>
          <div class="field-grid">
            <div class="field"><label for="c-phone">Phone number</label><input id="c-phone" type="tel" required placeholder="01XXXXXXXXX"></div>
            <div class="field"><label for="c-email">Email</label><input id="c-email" type="email" required></div>
          </div>
          <div class="field"><label for="c-address">Address</label><input id="c-address" required placeholder="House, road, area"></div>
          <div class="field-grid">
            <div class="field"><label for="c-city">City</label><input id="c-city" required></div>
            <div class="field"><label for="c-zip">Postal code</label><input id="c-zip" required></div>
          </div>
        </fieldset>

        <fieldset>
          <legend>Payment method</legend>
          <div class="pay-options">
            <label class="pay-option">
              <input type="radio" name="pay" value="bkash" checked>
              <span class="swatch" style="background:#E2136E">bKash</span>
              <span class="label">bKash</span>
              <span class="sub">Pay via bKash on confirmation</span>
            </label>
            <label class="pay-option">
              <input type="radio" name="pay" value="nagad">
              <span class="swatch" style="background:#F6921E">Nagad</span>
              <span class="label">Nagad</span>
              <span class="sub">Pay via Nagad on confirmation</span>
            </label>
            <label class="pay-option">
              <input type="radio" name="pay" value="cod">
              <span class="swatch" style="background:var(--ink)">COD</span>
              <span class="label">Cash on delivery</span>
              <span class="sub">Pay when your order arrives</span>
            </label>
          </div>
        </fieldset>

        <button type="submit" class="btn btn-primary btn-block" id="place-order">Place order <span class="btn-dot">→</span></button>
        <p style="font-size:0.72rem;color:var(--ink-soft);margin-top:12px;text-align:center;">Demo checkout — no real charge is made. Connect a payment gateway to go live.</p>
      </form>
    </div>

    <div class="summary-card">
      <h3 style="font-size:1.1rem;margin-bottom:18px;">Order summary</h3>
      <div class="summary-row"><span>Subtotal</span><span id="sum-subtotal">৳0</span></div>
      <div class="summary-row"><span>Delivery</span><span id="sum-delivery">৳0</span></div>
      <div class="summary-row total"><span>Total</span><span id="sum-total">৳0</span></div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:0;padding-top:0;">
      <span class="footer-copy">© 2026 FLEVA. All rights reserved.</span>
      <div class="footer-social"><a href="#">IG</a><a href="#">TT</a><a href="#">YT</a></div>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script>
  const DELIVERY_FEE = 80;

  function renderCart(){
    const cart = getCart();
    const container = document.getElementById('cart-lines');
    if(cart.length === 0){
      container.innerHTML = `<div class="empty-cart"><p>Your cart is empty.</p><a href="shop.html" class="btn btn-outline" style="margin-top:16px;">Browse the shop</a></div>`;
      document.getElementById('place-order').disabled = true;
    } else {
      container.innerHTML = cart.map(item => {
        const p = PRODUCTS.find(x => x.id === item.id);
        if(!p) return '';
        return `
        <div class="cart-line">
          <a href="product.html?id=${p.id}" class="media">${productMedia(p)}</a>
          <div class="info">
            <h4>${p.name}</h4>
            <span>৳${p.price} each</span>
          </div>
          <div class="qty-stepper">
            <button data-dec="${p.id}" aria-label="Decrease">−</button>
            <span>${item.qty}</span>
            <button data-inc="${p.id}" aria-label="Increase">+</button>
          </div>
          <span class="price">৳${p.price * item.qty}</span>
          <button class="remove" data-remove="${p.id}" aria-label="Remove">✕</button>
        </div>`;
      }).join('');
      document.getElementById('place-order').disabled = false;
    }
    renderSummary();
  }

  function renderSummary(){
    const subtotal = cartTotal();
    const delivery = subtotal > 0 ? DELIVERY_FEE : 0;
    document.getElementById('sum-subtotal').textContent = `৳${subtotal}`;
    document.getElementById('sum-delivery').textContent = `৳${delivery}`;
    document.getElementById('sum-total').textContent = `৳${subtotal + delivery}`;
  }

  document.getElementById('cart-lines').addEventListener('click', e => {
    const inc = e.target.closest('[data-inc]');
    const dec = e.target.closest('[data-dec]');
    const rem = e.target.closest('[data-remove]');
    const cart = getCart();
    if(inc){ const item = cart.find(i=>i.id===inc.dataset.inc); setQty(inc.dataset.inc, item.qty+1); renderCart(); }
    if(dec){ const item = cart.find(i=>i.id===dec.dataset.dec); if(item.qty<=1){ removeFromCart(dec.dataset.dec); } else { setQty(dec.dataset.dec, item.qty-1); } renderCart(); }
    if(rem){ removeFromCart(rem.dataset.remove); renderCart(); }
  });

  renderCart();

  document.getElementById('checkout-form').addEventListener('submit', e => {
    e.preventDefault();
    if(getCart().length === 0) return;
    const method = document.querySelector('input[name="pay"]:checked').value;
    const labels = { bkash: 'bKash', nagad: 'Nagad', cod: 'Cash on delivery' };
    showToast(`Order placed — pay via ${labels[method]}`);
    localStorage.removeItem('fleva_cart');
    setTimeout(() => { renderCart(); updateCartBadge(); }, 900);
  });
</script>
</body>
</html>
