<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — FLEVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="product-grid.css">
<style>
  .breadcrumb{ font-size:0.78rem; color:var(--ink-soft); margin-bottom:24px; }
  .breadcrumb a:hover{ text-decoration:underline; }
  .pdp-grid{ display:grid; grid-template-columns:0.9fr 1fr; gap:56px; align-items:start; }
  @media (max-width:860px){ .pdp-grid{ grid-template-columns:1fr; gap:32px; } }
  .pdp-media{ background:var(--cream-soft); border-radius:var(--radius-lg); aspect-ratio:1/1; padding:40px; position:sticky; top:110px; }
  @media (max-width:860px){ .pdp-media{ position:static; } }
  .pdp-media svg{ width:100%; height:100%; animation:floatSlow 6s ease-in-out infinite; }
  .pdp-media img{ width:100%; height:100%; object-fit:cover; border-radius:var(--radius-md); }
  @keyframes floatSlow{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
  .pdp-cat{ font-size:0.78rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--pink); }
  .pdp-title{ font-size:clamp(1.8rem,3.4vw,2.6rem); margin:10px 0 14px; text-transform:none; font-family:var(--font-body); font-weight:800; }
  .pdp-price{ font-family:var(--font-mono); font-size:1.6rem; font-weight:700; margin-bottom:20px; }
  .pdp-desc{ color:var(--ink-soft); line-height:1.7; margin-bottom:28px; max-width:480px; }
  .pdp-tag{ display:inline-block; background:var(--lime); border-radius:var(--radius-pill); padding:6px 14px; font-size:0.7rem; font-weight:800; letter-spacing:0.04em; margin-bottom:20px; }
  .qty-row{ display:flex; align-items:center; gap:18px; margin-bottom:22px; }
  .qty-stepper{ display:flex; align-items:center; border:2px solid var(--ink); border-radius:var(--radius-pill); overflow:hidden; }
  .qty-stepper button{ width:42px; height:44px; background:none; border:0; font-size:1.1rem; }
  .qty-stepper button:hover{ background:var(--ink); color:var(--cream); }
  .qty-stepper span{ width:36px; text-align:center; font-family:var(--font-mono); font-weight:700; }
  .pdp-actions{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:32px; }
  .pdp-meta{ display:flex; flex-direction:column; gap:10px; padding-top:24px; border-top:1px solid var(--line); font-size:0.85rem; }
  .pdp-meta div{ display:flex; gap:8px; }
  .pdp-meta b{ min-width:110px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">FLEVA</a>
    <nav class="nav-main">
      <a href="shop.html">Shop</a>
      <a href="about.html">Our Story</a>
      <a href="account.html">Rewards</a>
    </nav>
    <div class="header-icons">
      <a href="login.html" class="icon-btn" data-auth-icon aria-label="Account">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      </a>
      <a href="checkout.html" class="icon-btn" aria-label="Cart">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-count" data-cart-count>0</span>
      </a>
      <button class="icon-btn menu-toggle" aria-label="Open menu" onclick="document.querySelector('.mobile-nav').classList.add('open')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="mobile-nav">
  <div class="mobile-nav-top"><span class="logo">FLEVA</span><button class="close-btn" aria-label="Close menu">✕</button></div>
  <a href="shop.html">Shop</a>
  <a href="about.html">Our Story</a>
  <a href="account.html">Rewards</a>
</div>

<section class="section">
  <div class="wrap">
    <div class="breadcrumb"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <span id="crumb-name"></span></div>
    <div class="pdp-grid" id="pdp-root"></div>
  </div>
</section>

<section class="section" style="padding-top:0;">
  <div class="wrap">
    <h2 style="font-size:1.6rem;margin-bottom:20px;">You might also like</h2>
    <div class="product-grid" id="related-grid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-top">
      <div class="footer-tag">Crunch different.<br>Live <b>Fleva</b>.</div>
      <form class="newsletter-form" onsubmit="event.preventDefault(); showToast('Thanks — you\\'re on the list!'); this.reset();">
        <input type="email" placeholder="Enter your email" required>
        <button type="submit" aria-label="Subscribe">→</button>
      </form>
    </div>
    <div class="footer-bottom">
      <span class="footer-copy">© 2026 FLEVA. All rights reserved.</span>
      <div class="footer-social">
  <a href="https://instagram.com/flevaworld" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
  </a>
  <a href="https://facebook.com/flevaworld" aria-label="Facebook" target="_blank" rel="noopener noreferrer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3.81l.39-4h-4.2V7a1 1 0 0 1 1-1h3z"></path></svg>
  </a>
</div>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const targetId = params.get('id') || params.get('slug');

  async function initPDP() {
    if (!window.PRODUCTS || !PRODUCTS.length) {
      if (typeof loadProducts === 'function') await loadProducts();
    }
    const p = (typeof findProduct === 'function' ? findProduct(targetId) : null) || (window.PRODUCTS && PRODUCTS.length ? PRODUCTS[0] : null);
    if (!p) return;

    document.title = p.name + " — FLEVA";
    const crumbEl = document.getElementById('crumb-name');
    if (crumbEl) crumbEl.textContent = p.name;

    let qty = 1;
    function renderPDP(){
      const pdpRoot = document.getElementById('pdp-root');
      if (!pdpRoot) return;
      pdpRoot.innerHTML = `
        <div class="pdp-media">${productMedia(p)}</div>
        <div>
          <span class="pdp-cat">${p.category}</span>
          <h1 class="pdp-title">${p.name}</h1>
          <div class="pdp-tag">${p.tag}</div>
          <div class="pdp-price">${p.discountPrice ? `<span style="text-decoration:line-through;opacity:0.5;margin-right:8px;">৳${p.price}</span>৳${p.discountPrice}` : `৳${p.price}`}</div>
          <p class="pdp-desc">${p.desc}</p>
          ${p.rating ? `<div style="font-size:0.82rem;color:var(--ink-soft);margin-bottom:8px;">⭐ ${p.rating} (${p.numReviews || 0} review${p.numReviews !== 1 ? 's' : ''})</div>` : ''}
          ${p.availability === 'pre-order' ? `<div style="font-size:0.78rem;margin-bottom:14px;color:var(--lime);font-weight:700;background:var(--ink);display:inline-block;padding:2px 8px;border-radius:4px;">Pre-Order</div>` : (p.stock !== undefined ? `<div style="font-size:0.78rem;margin-bottom:14px;color:${p.stock > 5 ? 'var(--ink-soft)' : 'var(--pink-deep)'}">${p.stock > 0 ? (p.stock <= 5 ? `Only ${p.stock} left!` : 'In stock') : 'Out of stock'}</div>` : '')}
          <div class="qty-row">
            <div class="qty-stepper">
              <button id="qty-minus" aria-label="Decrease quantity">−</button>
              <span id="qty-val">${qty}</span>
              <button id="qty-plus" aria-label="Increase quantity">+</button>
            </div>
          </div>
          <div class="pdp-actions">
            ${(() => {
              const isAvail = !p.availability || p.availability === 'in-stock' || p.availability === 'pre-order' || (p.stock !== undefined && p.stock > 0);
              return `
              <button class="btn btn-primary" id="add-btn" ${!isAvail ? 'disabled style="opacity:0.5"' : ''}>${p.availability === 'pre-order' ? 'Pre-Order Now' : 'Add to cart'} <span class="btn-dot">🛒</span></button>
              <a href="checkout.html" class="btn btn-outline" id="buy-now" ${!isAvail ? 'style="pointer-events:none;opacity:0.5;"' : ''}>Buy now</a>
              `;
            })()}
          </div>
          <div class="pdp-meta">
            <div><b>Shipping</b><span>Delivered across Bangladesh, 2–5 business days.</span></div>
            <div><b>Payment</b><span>bKash, Nagad, or cash on delivery.</span></div>
            <div><b>Shelf life</b><span>12 months unopened, stored in a cool dry place.</span></div>
          </div>
        </div>`;

      document.getElementById('qty-minus').onclick = () => { qty = Math.max(1, qty-1); document.getElementById('qty-val').textContent = qty; };
      document.getElementById('qty-plus').onclick = () => { qty += 1; document.getElementById('qty-val').textContent = qty; };
      document.getElementById('add-btn').onclick = () => addToCart(p.id, qty);
      document.getElementById('buy-now').onclick = () => addToCart(p.id, qty);
    }
    renderPDP();

    document.getElementById('related-grid').innerHTML = PRODUCTS.filter(x=>x.id!==p.id).slice(0,4).map(renderProductCard).join('');

    // Load reviews from API
    if (p._id) {
      loadReviews(p._id);
    }
  }

  async function loadReviews(productId) {
    try {
      const res = await fetch(`${API_BASE}/reviews/${productId}`);
      const data = await res.json();
      if (data.reviews && data.reviews.length > 0) {
        const reviewsSection = document.createElement('section');
        reviewsSection.className = 'section';
        reviewsSection.innerHTML = `<div class="wrap">
          <h2 style="font-size:1.4rem;margin-bottom:20px;">Customer Reviews</h2>
          <div style="display:flex;flex-direction:column;gap:16px;">
            ${data.reviews.map(r => `
              <div style="background:var(--cream-soft);border-radius:var(--radius-sm);padding:20px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                  <strong style="font-size:0.9rem;">${r.user?.name || 'Anonymous'}</strong>
                  <span style="font-size:0.78rem;color:var(--ink-soft);">${'⭐'.repeat(r.rating)}</span>
                </div>
                ${r.title ? `<div style="font-weight:600;margin-bottom:4px;">${r.title}</div>` : ''}
                <p style="font-size:0.85rem;color:var(--ink-soft);">${r.comment}</p>
                ${r.isVerifiedPurchase ? '<span style="font-size:0.7rem;color:var(--plum);font-weight:600;">✓ Verified Purchase</span>' : ''}
              </div>
            `).join('')}
          </div>
        </div>`;
        // Insert before footer
        const footer = document.querySelector('.site-footer');
        footer.parentNode.insertBefore(reviewsSection, footer);
      }
    } catch (e) { /* silent */ }
  }

  initPDP();
  window.addEventListener('products-loaded', initPDP);
  document.addEventListener('products-loaded', initPDP);
</script>
<script src="chat-widget.js"></script>
</body>
</html>
